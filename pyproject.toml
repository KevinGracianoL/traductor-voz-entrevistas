[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP", "I", "S"]
# E,F = errores base | B = bugbear (bugs reales) | SIM = simplificaciones
# UP  = sintaxis moderna | I = imports ordenados | S = seguridad (bandit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --cov=latencia --cov=audio --cov-report=term-missing --cov-fail-under=90"

[tool.mutmut]
source_paths = ["latencia/", "audio/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov"]
# Los textos de mensajes/log no son conducta verificable:
# fijarlos congelaría la redacción sin proteger nada.
# patron_virtual default es equivalente por .lower() -> inmatable
do_not_mutate_patterns = ['raise ValueError', 'or "—', 'patron_virtual: str = "']
