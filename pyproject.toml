[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP", "I", "S"]
# E,F = errores base | B = bugbear (bugs reales) | SIM = simplificaciones
# UP  = sintaxis moderna | I = imports ordenados | S = seguridad (bandit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --cov=traductor.latencia --cov=traductor.audio.virtual --cov=traductor.traduccion --cov-report=term-missing --cov-fail-under=90"

[tool.mutmut]
source_paths = ["src/traductor/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov"]
mutate_only_covered_lines = true
# patron_virtual default es equivalente por .lower() -> inmatable
# Los 2 raise son textos de error no verificables -> patrones específicos de audio/virtual.py
do_not_mutate_patterns = ['patron_virtual: str = "', 'ruta vacía', 'sin dispositivo virtual']
