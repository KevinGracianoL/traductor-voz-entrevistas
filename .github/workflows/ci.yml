name: CI

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff mypy pytest pytest-cov mutmut
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: pytest
      - run: mutmut run