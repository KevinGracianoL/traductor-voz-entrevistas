name: CI

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.12.0 mypy==1.15.0 pytest==8.3.5 pytest-cov==6.0.0 mutmut==3.7.0
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: pytest
      - run: |
          mutmut run
          # mutmut 3.x siempre sale exit 0 aunque sobrevivan mutantes -> gate decorativo si no se verifica
          if mutmut results | grep -q "survived"; then
            echo "mutantes sobrevivientes detectados"
            mutmut results
            exit 1
          fi
